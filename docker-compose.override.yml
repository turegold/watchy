# 로컬 개발 전용. `docker compose up -d`/`docker compose up -d mysql redis` 실행 시
# docker-compose.yml과 자동으로 합쳐진다 (docker compose의 override 관례, -f 옵션 불필요).
# 프로덕션(EC2)은 이 파일이 없으므로 영향 없음 — RDS를 그대로 사용.
#
# MySQL을 RDS로 분리하면서 docker-compose.yml에서 지워졌던 mysql/adminer/redisinsight를
# 로컬 개발용으로 복원 (2026-08-10).
services:
  mysql:
    image: mysql:8.0
    container_name: watchparty-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: watchparty-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8081}:8080"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: watchparty-redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data

  # 로컬 실행 시 api 컨테이너는 안 씀(./gradlew bootRun으로 호스트에서 직접 실행) — 켜지지 않도록 비활성화
  api:
    profiles: ["disabled"]

volumes:
  mysql_data:
  redisinsight_data:
