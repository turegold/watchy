server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      # 기본 200. 부하테스트 시 TOMCAT_MAX_THREADS로 조절.
      # ⚠️ 스레드당 스택 ~1MB. EC2 메모리 여유 적고 스왑 0이라 과도하게 올리면 OOM 위험.
      max: ${TOMCAT_MAX_THREADS:200}

spring:
  application:
    name: watchparty

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 기본 10. 부하테스트 시 DB_POOL_SIZE로 조절 (RDS max_connections=60 미만 유지)
      maximum-pool-size: ${DB_POOL_SIZE:10}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "https://api.watchy.site/login/oauth2/code/{registrationId}"

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "https://api.watchy.site/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 1209600000

app:
  frontend-base-url: ${FRONTEND_BASE_URL}